<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Placeholder: pessoa sorrindo">
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5262"/>
      <stop offset="1" stop-color="#262b35"/>
