<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Preview de links (Open Graph / Twitter). Os valores por idioma são trocados em i18n.ts;
         as imagens são geradas com "npm run og" a partir de og/og.html. -->
    <meta
      name="description"
      content="Desenvolvedor web fullstack focado em plataformas de compliance bancário: Angular, Java, AWS e Docker. Currículo, experiência e projetos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yan Moura" />
    <meta property="og:title" content="Yan Moura · Desenvolvedor Web Fullstack" />
    <meta
      property="og:description"
      content="Desenvolvedor web fullstack focado em plataformas de compliance bancário: Angular, Java, AWS e Docker. Currículo, experiência e projetos."
    />
    <meta property="og:url" content="https://yanm1103.github.io/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://yanm1103.github.io/og-image.jpg" />

    <meta name="theme-color" content="#2f9be8" />
    <link rel="icon" type="image/svg+xml" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Primeira visita à página inicial com navegador em outro idioma: vai para /en.
      // Não age se a pessoa já escolheu um idioma no botão PT/EN, em links diretos
      // (só na raiz) nem para buscadores, que precisam indexar a versão em português.
      try {
        var path = location.pathname;
        if ((path === '/' || path === '/index.html') && !localStorage.getItem('lang')) {
          var bot = navigator.webdriver || /bot|crawl|spider|slurp|lighthouse|headless/i.test(navigator.userAgent);
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'pt'];
          var pt = langs.some(function (l) {
            return /^pt/i.test(l);
          });
          if (!bot && !pt) location.replace('/en/' + location.hash);
        }
      } catch (e) {}

      // aplica o tema salvo antes da primeira pintura, para não piscar
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
