<a class="skip" href="#conteudo">{{ ui.skip | tr: lang() }}</a>

<div class="aero-bg" aria-hidden="true">
  <svg viewBox="0 0 1600 600" preserveAspectRatio="none">
    <defs>
      <linearGradient id="bgSwooshG" x1="0" x2="1">
        <stop offset="0" stop-color="#9be86a" stop-opacity="0" />
        <stop offset="0.5" stop-color="#9be86a" stop-opacity="0.35" />
        <stop offset="1" stop-color="#7fd0ff" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="bgSwooshB" x1="0" x2="1">
        <stop offset="0" stop-color="#7fd0ff" stop-opacity="0" />
        <stop offset="0.5" stop-color="#7fd0ff" stop-opacity="0.4" />
        <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path d="M0 380 C 400 180, 900 520, 1600 260 L1600 330 C 900 580, 400 260, 0 450 Z" fill="url(#bgSwooshG)" />
    <path d="M0 300 C 500 120, 1000 460, 1600 200" fill="none" stroke="url(#bgSwooshB)" stroke-width="6" />
    <path d="M0 330 C 520 170, 1020 500, 1600 240" fill="none" stroke="url(#bgSwooshB)" stroke-width="2" />
  </svg>
  <app-fish-school [fish]="fish" />
</div>

<header class="topbar">
  <div class="container bar-wrap">
    <div class="bar glass">
      <a [routerLink]="i18n.paths().home" class="brand" [attr.aria-label]="ui.home | tr: lang()">
        <span class="logo"><span>YM</span></span>
        <span class="brand-name">Yan Moura</span>
      </a>

      <nav class="nav glass" [class.open]="menuOpen()" [attr.aria-label]="ui.sections | tr: lang()">
        @for (item of nav; track item.fragment) {
          <a [routerLink]="i18n.paths().home" [fragment]="item.fragment">{{ item.label | tr: lang() }}</a>
        }
        <a [routerLink]="i18n.paths().projects" class="btn primary all">{{ ui.allProjects | tr: lang() }}</a>
      </nav>

      <div class="actions">
        <a
          class="lang-btn"
          [href]="i18n.alternate()"
          (click)="switchLang($event)"
          [attr.hreflang]="lang() === 'pt' ? 'en' : 'pt-BR'"
          [attr.lang]="lang() === 'pt' ? 'en' : 'pt-BR'"
          [attr.aria-label]="ui.switchLang | tr: lang()"
          [attr.title]="ui.switchLang | tr: lang()"
        >
          <app-orb icon="globe" tone="aqua" [size]="30" />
          <span>{{ lang() === 'pt' ? 'EN' : 'PT' }}</span>
        </a>
        <button
          type="button"
          class="icon-btn"
          (click)="toggleTheme()"
          [attr.aria-label]="(theme() === 'dark' ? ui.lightTheme : ui.darkTheme) | tr: lang()"
        >
          <app-orb [icon]="theme() === 'dark' ? 'sun' : 'moon'" tone="glass" [size]="40" />
        </button>
        <button
          type="button"
          class="icon-btn menu-btn"
          (click)="menuOpen.set(!menuOpen())"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="ui.menu | tr: lang()"
        >
          <app-orb [icon]="menuOpen() ? 'close' : 'menu'" tone="blue" [size]="40" />
        </button>
      </div>
    </div>
  </div>
</header>

<main id="conteudo">
  <router-outlet />
</main>

<footer class="footer">
  <div class="container">
    <div class="foot glass">
      <p>© {{ year }} {{ r.name }}</p>
      <div class="social">
        <a [href]="r.links.github" target="_blank" rel="noopener" aria-label="GitHub">
          <app-orb icon="github" tone="blue" [size]="36" />
        </a>
        <a [href]="r.links.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
          <app-orb icon="linkedin" tone="blue" [size]="36" />
        </a>
        <a [href]="'mailto:' + r.email" aria-label="E-mail"><app-orb icon="mail" tone="green" [size]="36" /></a>
      </div>
    </div>
  </div>
</footer>
