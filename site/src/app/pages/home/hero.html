<section class="hero" [attr.aria-label]="ui.hero.label | tr: lang()">
  <!-- Céu: sol, nuvens e "swooshes" -->
  <svg class="layer sky" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" style="stop-color: var(--sun)" />
        <stop offset="1" style="stop-color: var(--sun)" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="swoosh" x1="0" x2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0" />
        <stop offset="0.5" stop-color="#fff" stop-opacity="0.85" />
        <stop offset="1" stop-color="#fff" stop-opacity="0" />
      </linearGradient>
    </defs>
    <circle cx="300" cy="250" r="300" fill="url(#sun)" />
    <circle cx="300" cy="250" r="60" style="fill: var(--sun)" opacity="0.9" />
    <path d="M-50 330 C 350 180, 800 420, 1650 220" fill="none" stroke="url(#swoosh)" stroke-width="10" opacity="0.5" />
    <path d="M-50 380 C 420 250, 900 470, 1650 300" fill="none" stroke="url(#swoosh)" stroke-width="3" opacity="0.7" />
    <path d="M-50 420 C 500 330, 1000 520, 1650 360" fill="none" stroke="url(#swoosh)" stroke-width="1.5" opacity="0.6" />
    <g class="clouds" style="fill: var(--cloud)">
      <g transform="translate(700 120)">
        <ellipse cx="0" cy="30" rx="120" ry="34" />
        <circle cx="-40" cy="10" r="40" />
        <circle cx="20" cy="-5" r="52" />
        <circle cx="70" cy="18" r="34" />
      </g>
      <g transform="translate(1250 200) scale(0.8)">
        <ellipse cx="0" cy="30" rx="130" ry="34" />
        <circle cx="-50" cy="12" r="38" />
        <circle cx="10" cy="-8" r="56" />
        <circle cx="72" cy="14" r="36" />
      </g>
      <g transform="translate(120 330) scale(0.6)" opacity="0.85">
        <ellipse cx="0" cy="30" rx="120" ry="30" />
        <circle cx="-30" cy="10" r="36" />
        <circle cx="30" cy="0" r="46" />
      </g>
      <g transform="translate(1480 90) scale(0.55)" opacity="0.8">
        <ellipse cx="0" cy="30" rx="120" ry="30" />
        <circle cx="-30" cy="10" r="36" />
        <circle cx="30" cy="0" r="46" />
      </g>
    </g>
  </svg>

  <!-- Prédios de vidro -->
  <svg class="layer city" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="towerA" x1="0" x2="1">
        <stop offset="0" style="stop-color: var(--glass-tower-1)" />
        <stop offset="0.45" style="stop-color: var(--glass-tower-2)" />
        <stop offset="1" style="stop-color: var(--glass-tower-3)" />
      </linearGradient>
      <linearGradient id="towerB" x1="0" x2="1">
        <stop offset="0" style="stop-color: var(--glass-tower-1)" />
        <stop offset="0.6" style="stop-color: var(--glass-tower-2)" />
        <stop offset="1" style="stop-color: var(--glass-tower-3)" />
      </linearGradient>
      <linearGradient id="towerShine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0.55" />
        <stop offset="1" stop-color="#fff" stop-opacity="0" />
      </linearGradient>
      <pattern id="windows" width="14" height="16" patternUnits="userSpaceOnUse">
        <rect x="2" y="3" width="10" height="9" rx="1.5" style="fill: var(--window)" />
      </pattern>
      <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: var(--sky-low)" stop-opacity="0" />
        <stop offset="1" style="stop-color: var(--sky-low)" stop-opacity="0.85" />
      </linearGradient>
    </defs>
    @for (t of towers; track t.x) {
      <g>
        <path [attr.d]="t.d" [attr.fill]="t.tone === 'a' ? 'url(#towerA)' : 'url(#towerB)'" />
        <path [attr.d]="t.d" fill="url(#windows)" opacity="0.7" />
        <rect
          [attr.x]="t.x + t.w * 0.1"
          [attr.y]="t.top + 30"
          [attr.width]="t.w * 0.12"
          [attr.height]="(730 - t.top) * 0.7"
          fill="url(#towerShine)"
        />
        @if (t.antenna) {
          <rect [attr.x]="t.x + t.w / 2 - 3" [attr.y]="t.top - 70" width="6" height="70" style="fill: var(--glass-tower-2)" />
          <circle [attr.cx]="t.x + t.w / 2" [attr.cy]="t.top - 74" r="7" fill="#ff5a4e" />
        }
      </g>
    }
    <rect x="0" y="520" width="1600" height="220" fill="url(#haze)" />
  </svg>

  <!-- Colinas -->
  <svg class="layer hills-back" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: var(--hill-back-1)" />
        <stop offset="1" style="stop-color: var(--hill-back-2)" />
      </linearGradient>
      <radialGradient id="tree" cx="0.35" cy="0.3" r="0.75">
        <stop offset="0" stop-color="#d9ffb8" />
        <stop offset="0.35" style="stop-color: var(--hill-front-1)" />
        <stop offset="1" style="stop-color: var(--hill-front-2)" />
      </radialGradient>
    </defs>
    <path d="M0 690 C 260 610, 560 700, 860 660 S 1380 600, 1600 650 V900 H0 Z" fill="url(#hillBack)" />
    <path d="M0 690 C 260 610, 560 700, 860 660 S 1380 600, 1600 650" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="3" />
    @for (tr of trees; track tr.x) {
      <rect [attr.x]="tr.x - 3" [attr.y]="tr.y" width="6" [attr.height]="tr.r" fill="#5a3d1e" opacity="0.8" />
      <circle [attr.cx]="tr.x" [attr.cy]="tr.y" [attr.r]="tr.r" fill="url(#tree)" />
    }
  </svg>

  <svg class="layer hills-front" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: var(--hill-front-1)" />
        <stop offset="1" style="stop-color: var(--hill-front-2)" />
      </linearGradient>
      <linearGradient id="hillShine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0.45" />
        <stop offset="1" stop-color="#fff" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path d="M0 790 C 240 730, 520 805, 820 775 S 1320 705, 1600 750 V900 H0 Z" fill="url(#hillFront)" />
    <path d="M0 790 C 240 730, 520 805, 820 775 S 1320 705, 1600 750 V800 C 1320 760, 1000 830, 820 820 S 240 780, 0 840 Z" fill="url(#hillShine)" />
  </svg>

  <!-- Peixes -->
  <app-fish-school class="fish" [fish]="fish" />

  <!-- Você -->
  <div class="person-wrap">
    <img
      class="person"
      [src]="r.photo"
      [alt]="r.name + ', ' + (ui.hero.photoAlt | tr: lang())"
      width="600"
      height="800"
      fetchpriority="high"
    />
  </div>

  <!-- Texto -->
  <div class="container content">
    <div class="intro glass">
      <p class="hello">{{ ui.hero.hello | tr: lang() }}</p>
      <h1>{{ r.name }}</h1>
      <p class="role">{{ r.role | tr: lang() }}</p>
      <div class="stack">
        @for (s of r.headlineStack; track s) {
          <span class="chip">{{ s }}</span>
        }
      </div>
      <p class="lead">{{ r.tagline | tr: lang() }}</p>
      <p class="where"><app-orb icon="pin" tone="aqua" [size]="26" /> {{ r.location | tr: lang() }}</p>
      <div class="cta">
        <a [routerLink]="i18n.paths().home" fragment="projetos" class="btn primary"
          >{{ ui.hero.seeProjects | tr: lang() }} <app-icon name="arrow-right"
        /></a>
        <a [href]="'mailto:' + r.email" class="btn"><app-icon name="mail" /> {{ ui.hero.contact | tr: lang() }}</a>
      </div>
      <div class="social">
        <a [href]="r.links.github" target="_blank" rel="noopener" aria-label="GitHub">
          <app-orb icon="github" tone="blue" [size]="44" />
        </a>
        <a [href]="r.links.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
          <app-orb icon="linkedin" tone="blue" [size]="44" />
        </a>
        <a [href]="'mailto:' + r.email" aria-label="E-mail">
          <app-orb icon="mail" tone="green" [size]="44" />
        </a>
      </div>
    </div>
  </div>
</section>
